<svg xmlns="http://www.w3.org/2000/svg" width="600" height="288" viewBox="0 0 600 288" role="img"><title>law at the terminal</title><g font-family="'Cascadia Mono',Consolas,monospace"><rect width="600" height="288" rx="10" fill="#0d0f14"/><rect x=".5" y=".5" width="599" height="287" rx="10" fill="none" stroke="#303037"/>
<style>@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes reveal{0%,8%{opacity:0}14%,100%{opacity:1}}.cursor{animation:blink 1.2s step-end infinite}.a{animation:reveal 8s infinite}.b{animation:reveal 8s .35s infinite}.c{animation:reveal 8s .7s infinite}@media(prefers-reduced-motion:reduce){.cursor,.a,.b,.c{animation:none}}</style>
<path d="M0 42H600" stroke="#303037"/><circle cx="21" cy="22" r="4" fill="#d49a7d"/><circle cx="37" cy="22" r="4" fill="#666368"/><circle cx="53" cy="22" r="4" fill="#45454c"/>
<text x="578" y="27" fill="#a9a7a1" font-size="12" text-anchor="end">law@arch ~</text>
<text x="24" y="78" fill="#d49a7d" font-size="17" >$ whoami</text><text x="24" y="107" fill="#eee9df" font-size="23" >law / low4k</text>
<g class="a"><text x="24" y="147" fill="#a9a7a1" font-size="15" >favorite</text><text x="165" y="147" fill="#d49a7d" font-size="16" >rust</text></g>
<g class="b"><text x="24" y="178" fill="#a9a7a1" font-size="15" >home</text><text x="165" y="178" fill="#eee9df" font-size="16" >linux + arch</text></g>
<g class="c"><text x="24" y="209" fill="#a9a7a1" font-size="15" >discord</text><text x="165" y="209" fill="#eee9df" font-size="16" >manhwamc</text></g>
<text x="24" y="259" fill="#d49a7d" font-size="16" >$ cargo run</text><rect class="cursor" x="143" y="245" width="10" height="18" fill="#d49a7d"/></g></svg>
